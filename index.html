<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindicato Juan Flores Vivas</title>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f4f6f9;
}

h1{
    text-align:center;
    color:#003366;
}

section{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.summary{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:220px;
    background:#e6f0ff;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

#chart_div{
    height:300px;
    margin-top:20px;
}

select, input, textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    background:#003366;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:0.9;
}

iframe{
    border:none;
    border-radius:10px;
}
</style>

<style>
.topnav{display:flex;gap:8px;justify-content:center;background:#003366;padding:10px;position:sticky;top:0;z-index:1000;}
.topnav button{width:auto;margin:0;background:#0b5ed7}
.tab{display:none}.tab.active{display:block}
.news-card{border:1px solid #ccc;border-radius:8px;padding:10px;margin:10px 0;background:#fff;}
.admin-only{display:none;} 
.login-container{background:#f0f0f0; padding:15px; border-radius:8px; margin-bottom:20px;}
</style>

<script>
// ==========================================
// TUS CREDENCIALES REALES DE FIREBASE
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyBXrIndvikCMg47NfN6NzmB3lYpui2AfWQ",
  authDomain: "noticias-sindicato-cips.firebaseapp.com",
  projectId: "noticias-sindicato-cips",
  storageBucket: "noticias-sindicato-cips.firebasestorage.app",
  messagingSenderId: "113761910632",
  appId: "1:113761910632:web:d0ea2b15a4d82fbe0f20dd"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let noticiaEditandoId = null; 
let esAdmin = false; 

function showTab(id){
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

window.addEventListener('DOMContentLoaded',()=>{
    document.body.insertAdjacentHTML('afterbegin','<div class="topnav"><button onclick="showTab(\'docs\')">Documentos</button><button onclick="showTab(\'gal\')">Galería</button><button onclick="showTab(\'vid\')">Videos</button><button onclick="showTab(\'news\')">Noticias</button></div>');
    document.getElementById('docs').classList.add('active');
    
    // Asignar la fecha por defecto de forma segura
    setTimeout(() => {
        let fInput = document.getElementById('fecha');
        if(fInput) fInput.value = new Date().toISOString().slice(0,10);
    }, 500);

    // Escuchar el estado de la sesión de Firebase
    auth.onAuthStateChanged(user => {
        // Tu UID específico autorizado en las reglas de Firestore
        if (user && user.uid === 'vXgKZhno0gg2Egz1DSPOHuplo502') {
            esAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
        } else {
            esAdmin = false;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'none';
        }
        // Cargar noticias para todos los usuarios visitantes
        cargarNoticiasFirestore();
    });
});

// Manejo de Login y Logout
function loginAdmin(){
    let email = document.getElementById('adminEmail').value.trim();
    let pass = document.getElementById('adminPass').value;
    
    if(!email || !pass) {
        alert("Por favor ingresa tu correo y contraseña.");
        return;
    }
    
    auth.signInWithEmailAndPassword(email, pass)
        .then((userCredential) => {
            alert("¡Sesión iniciada con éxito como Administrador!");
        })
        .catch(error => {
            alert("Error de autenticación: " + error.message + "\n\nVerifica que tu correo sea osmantrader777@gmail.com y la contraseña sea la correcta en la sección de 'Usuarios' de Firebase.");
        });
}

function logoutAdmin(){
    auth.signOut().then(() => {
        alert("Sesión cerrada.");
    });
}

// Publicar o Actualizar Noticia en Cloud Firestore
function publicar(){
    if(!esAdmin) return alert("No tienes permisos para realizar esta acción.");

    let txtTitulo = document.getElementById('titulo').value;
    let txtDescripcion = document.getElementById('descripcion').value;
    let txtFecha = document.getElementById('fecha').value;
    let fileFoto = document.getElementById('foto').files[0];

    if(!txtTitulo && !txtDescripcion) {
        alert("Por favor escribe al menos un título o una descripción.");
        return;
    }

    if(fileFoto){
        let r=new FileReader();
        r.onload=e=>guardarEnFirestore(txtTitulo, txtDescripcion, txtFecha, e.target.result);
        r.readAsDataURL(fileFoto);
    } else {
        let imgExistente = noticiaEditandoId ? document.getElementById('img_' + noticiaEditandoId)?.src || '' : '';
        guardarEnFirestore(txtTitulo, txtDescripcion, txtFecha, imgExistente);
    }
}

function guardarEnFirestore(t, d, f, img){
    let datosNoticia = {
        titulo: t,
        descripcion: d,
        fecha: f,
        imagen: img,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    if(noticiaEditandoId){
        db.collection('Noticias').doc(noticiaEditandoId).update(datosNoticia)
        .then(() => {
            noticiaEditandoId = null;
            document.getElementById('btnPublicar').innerText = "Publicar noticia";
            limpiarFormulario();
        }).catch(err => alert("Error al actualizar: " + err.message));
    } else {
        db.collection('Noticias').add(datosNoticia)
        .then(() => {
            limpiarFormulario();
        }).catch(err => alert("Error al publicar: " + err.message));
    }
}

// Cargar Noticias en tiempo real desde Firestore (Sin orderBy para no exigir índices)
function cargarNoticiasFirestore(){
    db.collection('Noticias').onSnapshot(snapshot => {
        let c = document.getElementById('lista');
        if(!c) return;
        c.innerHTML = ''; 
        
        snapshot.forEach(doc => {
            let id = doc.id;
            let data = doc.data();
            
            let n = document.createElement('div');
            n.className = 'news-card';
            
            let botonesAdmin = esAdmin ? 
                `<br><button style="width:auto; margin-right:5px; background:#ffc107; color:#000" onclick="editarFirestore('${id}', '${data.titulo}', '${data.fecha}', \`${data.descripcion ? data.descripcion.replace(/'/g, "\\'") : ''}\`)">Editar</button> 
                 <button style="width:auto; background:#dc3545" onclick="eliminarFirestore('${id}')">Eliminar</button>` 
                : '';

            n.innerHTML = '<h3>'+(data.titulo || '')+'</h3><small>'+(data.fecha || '')+'</small><p>'+(data.descripcion || '')+'</p>'+(data.imagen?'<img id="img_'+id+'" src="'+data.imagen+'" style="max-width:100%">':'')+botonesAdmin;
            c.appendChild(n); 
        });
    }, error => {
        console.log("Error al leer datos de Firestore: ", error.message);
    });
}

function editarFirestore(id, t, f, d){
    noticiaEditandoId = id;
    document.getElementById('titulo').value = t;
    document.getElementById('fecha').value = f;
    document.getElementById('descripcion').value = d;
    document.getElementById('btnPublicar').innerText = "Guardar Cambios";
    window.scrollTo(0, document.getElementById('news').offsetTop);
}

// Eliminar noticia física en Firestore
function eliminarFirestore(id){
    if(confirm("¿Seguro que deseas eliminar esta noticia?")){
        db.collection('Noticias').doc(id).delete()
        .catch(err => alert("Error al eliminar: " + err.message));
    }
}

function limpiarFormulario(){
    document.getElementById('titulo').value='';
    document.getElementById('descripcion').value='';
    document.getElementById('foto').value='';
    document.getElementById('fecha').value=new Date().toISOString().slice(0,10);
}
</script>
</head>

<body>
<div id="docs" class="tab">

<div id="reportePDF">

<h1>Sindicato Juan Flores Vivas</h1>

<section>

<select id="mesSelector"></select>

<button onclick="descargarPDF()">
📄 Descargar Reporte PDF
</button>

<div class="summary">
    <div class="card">
        <h3>Ingresos</h3>
        <p id="ingresos">C$ 0.00</p>
    </div>

    <div class="card">
        <h3>Egresos</h3>
        <p id="egresos">C$ 0.00</p>
    </div>

    <div class="card">
        <h3>Diferencia</h3>
        <p id="diferencia">C$ 0.00</p>
    </div>
</div>

<div id="chart_div"></div>

</section>

</div>

<section>
<h3>Archivo completo</h3>

<iframe
src="https://docs.google.com/spreadsheets/d/1g8g4YVEk1mZ8IF86sLmqfoXYBDQjsTHe/preview"
width="100%"
height="450">
</iframe>

</section>

<script>
// Reportes de Google Charts (Completamente Intacto)
google.charts.load('current', {'packages':['corechart']});
const SHEET_ID = "1g8g4YVEk1mZ8IF86sLmqfoXYBDQjsTHe";
const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function limpiarNumero(valor){
    if(typeof valor === "string"){ valor = valor.replace(/[^\d.-]/g,""); }
    return parseFloat(valor) || 0;
}

function query(sheet, callback){
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&headers=1`;
    const q = new google.visualization.Query(url);
    q.send(res=>{
        if(res.isError()){ console.error("Error en hoja:", sheet); callback(null); }
        else{ callback(res.getDataTable()); }
    });
}

function calcularPorMes(data, mesIndex, year){
    let total = 0;
    for(let i=0;i<data.getNumberOfRows();i++){
        let fecha = new Date(data.getValue(i,0));
        let monto = limpiarNumero(data.getValue(i,3));
        if(fecha instanceof Date && !isNaN(fecha)){
            if(fecha.getMonth() === mesIndex && fecha.getFullYear() === year){ total += monto; }
        }
    }
    return total;
}

function formatoCordobas(valor){
    return "C$ " + valor.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}

function cargarDatos(mesIndex, year){
    query("INGRESOS", ingresosData=>{
        query("EGRESOS", egresosData=>{
            let ingresos = ingresosData ? calcularPorMes(ingresosData, mesIndex, year) : 0;
            let egresos = egresosData ? calcularPorMes(egresosData, mesIndex, year) : 0;
            let diferencia = ingresos - egresos;

            document.getElementById("ingresos").innerText = formatoCordobas(ingresos);
            document.getElementById("egresos").innerText = formatoCordobas(egresos);
            document.getElementById("diferencia").innerText = formatoCordobas(diferencia);

            const chartData = google.visualization.arrayToDataTable([['Tipo','Monto'], ['Ingresos', ingresos], ['Egresos', egresos]]);
            const chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
            chart.draw(chartData,{title:`Reporte - ${meses[mesIndex]} ${year}`, legend:{position:"none"}});
        });
    });
}

function iniciar(){
    const select = document.getElementById("mesSelector");
    const year = new Date().getFullYear();
    meses.forEach((mes,index)=>{
        let option = document.createElement("option");
        option.value = index; option.text = mes + " " + year;
        select.appendChild(option);
    });
    select.addEventListener("change",()=>{ cargarDatos(parseInt(select.value), year); });
    const mesActual = new Date().getMonth();
    select.value = mesActual;
    cargarDatos(mesActual, year);
}

async function descargarPDF(){
    const { jsPDF } = window.jspdf;
    const reporte = document.getElementById("reportePDF");
    const canvas = await html2canvas(reporte,{scale:2});
    const imgData = canvas.toDataURL("image/png");
    const pdf = new jsPDF("p","mm","a4");
    const ancho = 190;
    const alto = (canvas.height * ancho) / canvas.width;
    pdf.addImage(imgData, "PNG", 10, 10, ancho, alto);
    pdf.save("Reporte_Sindicato.pdf");
}
google.charts.setOnLoadCallback(iniciar);
</script>

</div>

<div id="gal" class="tab"><section><h2>Galería</h2><iframe src="https://docs.google.com/spreadsheets/d/1RLkiCHt-R_CjBlUgBM4YS_grRo8Wp5Rl/preview" width="100%" height="600"></iframe></section></div>
<div id="vid" class="tab"><section><h2>Videos</h2><iframe src="https://docs.google.com/spreadsheets/d/1e6x93z5jkCPXMkNWPR_juLbabQXbpEot/preview" width="100%" height="600"></iframe></section></div>

<div id="news" class="tab">
    <section>
        <h2>Noticias Informativas</h2>
        
        <div id="loginSection" class="login-container">
            <h4>Acceso Administrador</h4>
            <input type="email" id="adminEmail" placeholder="Correo electrónico">
            <input type="password" id="adminPass" placeholder="Contraseña">
            <button onclick="loginAdmin()" style="background:#28a745; margin:0;">Iniciar Sesión</button>
        </div>
        
        <button id="logoutBtn" onclick="logoutAdmin()" style="display:none; background:#dc3545; margin-bottom:20px;">Cerrar Sesión de Admin</button>

            <input id="titulo" placeholder="Título"><br>
            <input id="fecha" type="date"><br>
            <textarea id="descripcion" style="height:120px" placeholder="Descripción"></textarea><br>
            <input id="foto" type="file" accept="image/*"><br>
            <button id="btnPublicar" onclick="publicar()">Publicar noticia</button>
        </div>
        
        <div id="lista"></div>
    </section>
</div>
</body>
</html>

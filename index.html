// ---------------- MÓDULO DE FINANZAS CONECTADO A GOOGLE DRIVE (RESUMEN MENSUAL) ----------------
function iniciarFinanzas() {
    try {
        const mesSelector = document.getElementById('mesSelector');
        if (!mesSelector) return;

        mesSelector.innerHTML = '';
        const mesesNombres = {
            "10": "Octubre", "11": "Noviembre", "12": "Diciembre",
            "01": "Enero", "02": "Febrero", "03": "Marzo",
            "04": "Abril", "05": "Mayo", "06": "Junio",
            "07": "Julio", "08": "Agosto", "09": "Septiembre"
        };
        
        // Poblar el selector con los meses registrados
        Object.keys(datosFinancierosDrive).forEach(key => {
            let opt = document.createElement('option');
            opt.value = key;
            let partes = key.split('-');
            let anio = partes[0];
            let mesNum = partes[1];
            opt.textContent = (mesesNombres[mesNum] || mesNum) + " " + anio;
            mesSelector.appendChild(opt);
        });

        // Seleccionar por defecto el mes más reciente (Octubre 2026)
        mesSelector.value = "2026-10";

        mesSelector.addEventListener('change', () => {
            actualizarDatosFinancierosMes(mesSelector.value);
        });

        actualizarDatosFinancierosMes(mesSelector.value);
    } catch (e) {
        console.error("Error al iniciar finanzas:", e);
    }
}

function actualizarDatosFinancierosMes(periodo) {
    let datos = datosFinancierosDrive[periodo] || { ingresos: 0, egresos: 0, saldoMes: 0, saldoInicial: 0 };
    
    let ingresosMes = datos.ingresos;
    let egresosMes = datos.egresos;
    let superavit = datos.saldoMes;
    let saldoInicial = datos.saldoInicial;
    let saldoFinal = saldoInicial + superavit;

    // Actualizar tarjetas de control
    document.getElementById('ingresos').innerText = `C$ ${ingresosMes.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('egresos').innerText = `C$ ${egresosMes.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('diferencia').innerText = `C$ ${superavit.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('saldoFinal').innerText = `C$ ${saldoFinal.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

    // Actualizar tabla financiera consolidada
    document.getElementById('tblSaldoInicial').innerText = `C$ ${saldoInicial.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('tblIngresos').innerText = `C$ ${ingresosMes.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('tblEgresos').innerText = `C$ ${egresosMes.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('tblResultadoMes').innerText = `C$ ${superavit.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('tblSaldoFinal').innerText = `C$ ${saldoFinal.toLocaleString('en-US', {minimumFractionDigits: 2})}`;

    renderizarGraficoFinanzas(ingresosMes, egresosMes, superavit);
}

function renderizarGraficoFinanzas(ingresos, egresos, resultado) {
    const canvasEl = document.getElementById('financeChart');
    if (!canvasEl) return;
    const ctx = canvasEl.getContext('2d');

    if (financeChartInstance) {
        financeChartInstance.destroy();
    }

    financeChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Ingresos', 'Egresos', 'Superávit / Déficit'],
            datasets: [{
                label: 'Monto en Córdobas (C$)',
                data: [ingresos, egresos, resultado],
                backgroundColor: ['#28a745', '#dc3545', '#003366'],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            }
        }
    });
}

function descargarPDF() {
    const { jsPDF } = window.jspdf;
    const reporte = document.getElementById('reportePDF');
    
    if (!reporte) return;

    html2canvas(reporte, { scale: 2 }).then(canvas => {
        let imgData = canvas.toDataURL('image/png');
        let pdf = new jsPDF('p', 'mm', 'a4');
        let imgWidth = 190;
        let pageHeight = 295;
        let imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight;
        let position = 10;

        pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;

        while (heightLeft >= 0) {
            position = heightLeft - imgHeight;
            pdf.addPage();
            pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
        }

        pdf.save('Reporte_Financiero_Sindicato.pdf');
    }).catch(err => {
        alert("Error al generar el PDF: " + err.message);
    });
}

// ---------------- CÁLCULO DE ESPACIO DE ALMACENAMIENTO ----------------
async function calcularEspacioUsado() {
    try {
        let totalBytes = 0;
        let snapshotNoticias = await db.collection('Noticias').get();
        snapshotNoticias.forEach(doc => {
            let img = doc.data().imagen;
            if (img && img.startsWith('data:image')) {
                totalBytes += Math.round((img.length * 3) / 4);
            }
        });
        let snapshotGaleria = await db.collection('GaleriaFotos').get();
        snapshotGaleria.forEach(doc => {
            let img = doc.data().imagen;
            if (img && img.startsWith('data:image')) {
                totalBytes += Math.round((img.length * 3) / 4);
            }
        });
        const limiteBytes = 1 * 1024 * 1024 * 1024; // 1 GB
        let porcentaje = (totalBytes / limiteBytes) * 100;
        if (porcentaje > 100) porcentaje = 100;
        let mbUsados = (totalBytes / (1024 * 1024)).toFixed(2);
        let mbDisponibles = ((limiteBytes - totalBytes) / (1024 * 1024)).toFixed(2);
        if (mbDisponibles < 0) mbDisponibles = 0;
        document.querySelectorAll('.storage-text').forEach(el => {
            el.innerText = `Espacio usado: ${mbUsados} MB / Disponible:${mbDisponibles} MB (1 GB Máx)`;
        });
        document.querySelectorAll('.storage-bar-fill').forEach(el => {
            el.style.width = porcentaje + '%';
            if (porcentaje > 80) {
                el.style.background = '#dc3545';
            } else {
                el.style.background = '#28a745';
            }
        });
    } catch (e) {
        console.error("Error calculando almacenamiento:", e);
    }
}

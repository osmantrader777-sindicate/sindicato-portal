// ---------------- CÁLCULO DE ESPACIO DE ALMACENAMIENTO ----------------
async function calcularEspacioUsado() {
    try {
        let totalBytes = 0;

        let snapshotNoticias = await db.collection('Noticias').get();
        snapshotNoticias.forEach(doc => {
            let img = doc.data().imagen;
            if (img && img.startsWith('data:image')) {
                totalBytes += Math.round((img.length * 3) / 4);
            }
        });

        let snapshotGaleria = await db.collection('GaleriaFotos').get();
        snapshotGaleria.forEach(doc => {
            let img = doc.data().imagen;
            if (img && img.startsWith('data:image')) {
                totalBytes += Math.round((img.length * 3) / 4);
            }
        });

        const limiteBytes = 1 * 1024 * 1024 * 1024; // 1 GB Límite Gratuito
        let porcentaje = (totalBytes / limiteBytes) * 100;
        if (porcentaje > 100) porcentaje = 100;

        let mbUsados = (totalBytes / (1024 * 1024)).toFixed(2);
        let mbDisponibles = ((limiteBytes - totalBytes) / (1024 * 1024)).toFixed(2);
        if (mbDisponibles < 0) mbDisponibles = 0;

        document.querySelectorAll('.storage-text').forEach(el => {
            el.innerText = `Espacio usado: ${mbUsados} MB / Disponible: ${mbDisponibles} MB (1 GB Máx)`;
        });
        document.querySelectorAll('.storage-bar-fill').forEach(el => {
            el.style.width = porcentaje + '%';
            if (porcentaje > 80) {
                el.style.background = '#dc3545';
            } else {
                el.style.background = '#28a745';
            }
        });
    } catch (e) {
        console.error("Error calculando almacenamiento:", e);
    }
}

// ---------------- PUBLICACIÓN DE NOTICIAS ----------------
function publicar() {
    let txtTitulo = document.getElementById('titulo').value;
    let txtDescripcion = document.getElementById('descripcion').value;
    let txtFecha = document.getElementById('fecha').value;
    let fileInput = document.getElementById('foto');
    let archivos = fileInput.files;

    if (!txtTitulo && !txtDescripcion) {
        alert("Por favor escribe un título o descripción.");
        return;
    }

    if (archivos && archivos.length > 0) {
        let index = 0;
        function procesarSiguiente() {
            if (index < archivos.length) {
                comprimirImagen(archivos[index], 1000, 0.7, function(imgComprimida) {
                    let tituloActual = archivos.length > 1 ? `${txtTitulo} (${index + 1})` : txtTitulo;
                    guardarEnFirestore(tituloActual, txtDescripcion, txtFecha, imgComprimida, index === 0 && noticiaEditandoId ? noticiaEditandoId : null);
                    index++;
                    procesarSiguiente();
                });
            } else {
                limpiarFormulario();
                alert("¡Noticia(s) publicada(s) con éxito!");
            }
        }
        procesarSiguiente();
    } else {
        if (noticiaEditandoId) {
            db.collection('Noticias').doc(noticiaEditandoId).get().then(doc => {
                let imgExistente = doc.exists ? (doc.data().imagen || '') : '';
                guardarEnFirestore(txtTitulo, txtDescripcion, txtFecha, imgExistente, noticiaEditandoId);
            });
        } else {
            guardarEnFirestore(txtTitulo, txtDescripcion, txtFecha, '', null);
        }
    }
}

function guardarEnFirestore(t, d, f, img, docId) {
    let datosNoticia = {
        titulo: t,
        descripcion: d,
        fecha: f,
        imagen: img,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (docId) {
        db.collection('Noticias').doc(docId).update(datosNoticia).then(() => {
            limpiarFormulario();
            alert("¡Noticia actualizada!");
            calcularEspacioUsado();
        }).catch(err => alert("Error al actualizar: " + err.message));
    } else {
        db.collection('Noticias').add(datosNoticia).then(() => {
            calcularEspacioUsado();
        }).catch(err => alert("Error al publicar: " + err.message));
    }
}

// ---------------- SUBIDA MASIVA A GALERÍA DE CUALQUIER ACTIVIDAD ----------------
function subirFotoGaleria() {
    let tituloActividad = document.getElementById('galeriaTitulo').value.trim();
    let fileInput = document.getElementById('galeriaInputFoto');
    let archivos = fileInput.files;

    if (!archivos || archivos.length === 0) {
        alert("Por favor selecciona al menos una foto desde tu celular.");
        return;
    }

    let nombreBase = tituloActividad || 'Actividad Sindicato';
    let index = 0;

    function subirSiguiente() {
        if (index < archivos.length) {
            comprimirImagen(archivos[index], 1200, 0.75, function(imgComprimida) {
                let nombreFinal = archivos.length > 1 ? `${nombreBase} (${index + 1})` : nombreBase;
                
                db.collection('GaleriaFotos').add({
                    titulo: nombreFinal,
                    imagen: imgComprimida,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    index++;
                    subirSiguiente();
                }).catch(err => {
                    console.error("Error al subir foto: ", err);
                    index++;
                    subirSiguiente();
                });
            });
        } else {
            document.getElementById('galeriaTitulo').value = '';
            fileInput.value = '';
            alert(`¡Se subieron ${archivos.length} fotos correctamente a la Galería!`);
            calcularEspacioUsado();
        }
    }
    subirSiguiente();
}

function cargarGaleriaFotos() {
    db.collection('GaleriaFotos').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        let grid = document.getElementById('galeriaFotosGrid');
        if (!grid) return;
        grid.innerHTML = '';
        galeriaFotosArray = [];

        if (snapshot.empty) {
            grid.innerHTML = '<p style="color:#666; font-size:0.9rem; grid-column:1/-1;">Aún no hay fotos cargadas en la galería.</p>';
            return;
        }

        let idx = 0;
        snapshot.forEach(doc => {
            let id = doc.id;
            let data = doc.data();

            galeriaFotosArray.push({
                url: data.imagen,
                titulo: data.titulo || 'Actividad Sindicato'
            });

            let currentIdx = idx;
            let card = document.createElement('div');
            card.className = 'gallery-card';

            let html = `<img src="${data.imagen}" alt="Actividad Sindicato" onclick="abrirVisorGaleria(${currentIdx})">
                        <div class="info" onclick="abrirVisorGaleria(${currentIdx})">
                            ${escapeHtml(data.titulo || '')}
                        </div>`;

            if (esAdmin) {
                html += `<button style="background:#dc3545; padding:6px; font-size:0.75rem; border-radius:0 0 8px 8px; border:none;" onclick="eliminarFotoGaleria('${id}')"><i class="fa-solid fa-trash"></i> Eliminar</button>`;
            }

            card.innerHTML = html;
            grid.appendChild(card);
            idx++;
        });
    });
}

function eliminarFotoGaleria(id) {
    if (confirm("¿Deseas eliminar esta foto de la galería?")) {
        db.collection('GaleriaFotos').doc(id).delete().then(() => {
            calcularEspacioUsado();
        }).catch(err => alert("Error: " + err.message));
    }
}

// ---------------- VISOR CARRUSEL DE FOTOS ----------------
function abrirVisorGaleria(index) {
    if (galeriaFotosArray.length === 0) return;
    indiceFotoActual = index;
    actualizarCarruselModal();
    document.getElementById('lightboxModal').style.display = 'flex';
}

function abrirVisorUnica(url, titulo) {
    galeriaFotosArray = [{ url: url, titulo: titulo || '' }];
    indiceFotoActual = 0;
    actualizarCarruselModal();
    document.getElementById('lightboxModal').style.display = 'flex';
}

function moverCarrusel(direccion, event) {
    if (event) event.stopPropagation();
    indiceFotoActual += direccion;
    if (indiceFotoActual < 0) {
        indiceFotoActual = galeriaFotosArray.length - 1;
    } else if (indiceFotoActual >= galeriaFotosArray.length) {
        indiceFotoActual = 0;
    }
    actualizarCarruselModal();
}

function actualizarCarruselModal() {
    let foto = galeriaFotosArray[indiceFotoActual];
    if (foto) {
        document.getElementById('lightboxImg').src = foto.url;
        document.getElementById('lightboxCaption').innerText = `${foto.titulo} (${indiceFotoActual + 1} de ${galeriaFotosArray.length})`;
    }
}

function cerrarFotoModal() {
    document.getElementById('lightboxModal').style.display = 'none';
}

// ---------------- MÓDULO DE FINANZAS Y REPORTES PDF ----------------
function iniciarFinanzas() {
    let mesSelector = document.getElementById('mesSelector');
    if (!mesSelector) return;

    const meses = [
        { valor: '2026-10', texto: 'Octubre 2026' },
        { valor: '2026-09', texto: 'Septiembre 2026' },
        { valor: '2026-08', texto: 'Agosto 2026' },
        { valor: '2026-07', texto: 'Julio 2026' }
    ];

    mesSelector.innerHTML = '';
    meses.forEach(m => {
        let opt = document.createElement('option');
        opt.value = m.valor;
        opt.innerText = m.texto;
        mesSelector.appendChild(opt);
    });

    mesSelector.addEventListener('change', actualizarDatosFinancieros);
    actualizarDatosFinancieros();
}

function actualizarDatosFinancieros() {
    let ingresos = 45000.00;
    let egresos = 28500.00;
    let diferencia = ingresos - egresos;

    document.getElementById('ingresos').innerText = `C$ ${ingresos.toLocaleString('es-NI', {minimumFractionDigits: 2})}`;
    document.getElementById('egresos').innerText = `C$ ${egresos.toLocaleString('es-NI', {minimumFractionDigits: 2})}`;
    document.getElementById('diferencia').innerText = `C$ ${diferencia.toLocaleString('es-NI', {minimumFractionDigits: 2})}`;

    renderizarGraficaFinanciera(ingresos, egresos);
}

let financeChartInstance = null;
function renderizarGraficaFinanciera(ingresos, egresos) {
    const ctx = document.getElementById('financeChart');
    if (!ctx) return;

    if (financeChartInstance) {
        financeChartInstance.destroy();
    }

    financeChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Ingresos', 'Egresos', 'Balance'],
            datasets: [{
                label: 'Córdobas (C$)',
                data: [ingresos, egresos, ingresos - egresos],
                backgroundColor: ['#28a745', '#dc3545', '#003366'],
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}

async function descargarPDF() {
    const { jsPDF } = window.jspdf;
    let elementoReporte = document.getElementById('reportePDF');
    
    try {
        let canvas = await html2canvas(elementoReporte, { scale: 2 });
        let imgData = canvas.toDataURL('image/png');
        
        let pdf = new jsPDF('p', 'mm', 'a4');
        let pageWidth = pdf.internal.pageSize.getWidth();
        let pageHeight = (canvas.height * pageWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 10, pageWidth, pageHeight);
        pdf.save('Reporte_Financiero_Sindicato.pdf');
    } catch (e) {
        alert("Error al generar el PDF: " + e.message);
    }
}

// ---------------- CONVERTIDOR Y COMPRESOR DE IMÁGENES ----------------
function comprimirImagen(file, maxDimension, calidad, callback) {
    let reader = new FileReader();
    reader.onload = function(e) {
        let img = new Image();
        img.src = e.target.result;
        img.onload = function() {
            let canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
                if (width > maxDimension) {
                    height *= maxDimension / width;
                    width = maxDimension;
                }
            } else {
                if (height > maxDimension) {
                    width *= maxDimension / height;
                    height = maxDimension;
                }
            }

            canvas.width = width;
            canvas.height = height;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', calidad));
        };
    };
    reader.readAsDataURL(file);
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function editarFirestore(id, t, f, d) {
    noticiaEditandoId = id;
    document.getElementById('titulo').value = t;
    document.getElementById('fecha').value = f;
    document.getElementById('descripcion').value = d;
    document.getElementById('btnPublicar').innerText = "Guardar Cambios";
    window.scrollTo({ top: document.getElementById('news').offsetTop, behavior: 'smooth' });
}

function eliminarFirestore(id) {
    if (confirm("¿Seguro que deseas eliminar esta noticia?")) {
        db.collection('Noticias').doc(id).delete().then(() => {
            calcularEspacioUsado();
        }).catch(err => alert("Error: " + err.message));
    }
}

function limpiarFormulario() {
    noticiaEditandoId = null;
    document.getElementById('titulo').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('foto').value = '';
    document.getElementById('fecha').value = new Date().toISOString().slice(0, 10);
    document.getElementById('btnPublicar').innerText = "Publicar noticia";
}
</script>
</head>

<body>

<div class="app-header">
    <h1>Sindicato Juan Flores Vivas</h1>
</div>

<!-- VISOR CARRUSEL PANTALLA COMPLETA -->
<div id="lightboxModal" class="lightbox-modal" onclick="cerrarFotoModal()">
    <span class="lightbox-close" onclick="cerrarFotoModal()">&times;</span>
    <button class="lightbox-btn lightbox-prev" onclick="moverCarrusel(-1, event)"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="lightboxImg" src="" alt="Foto Ampliada" onclick="event.stopPropagation()">
    <button class="lightbox-btn lightbox-next" onclick="moverCarrusel(1, event)"><i class="fa-solid fa-chevron-right"></i></button>
    <div id="lightboxCaption" class="lightbox-caption"></div>
</div>

<!-- PESTAÑA PRINCIPAL: NOTICIAS Y GALERÍA -->
<div id="news" class="tab active">
    <div class="card-section">
        <h2><i class="fa-regular fa-newspaper"></i> Noticias y Galería</h2>
        
        <div id="loginSection" class="login-container">
            <h4 style="margin-top:0;">Acceso Administrador</h4>
            <input type="email" id="adminEmail" placeholder="Correo electrónico">
            <input type="password" id="adminPass" placeholder="Contraseña">
            <button onclick="loginAdmin()" style="background:#28a745;">Iniciar Sesión</button>
        </div>
        
        <button id="logoutBtn" onclick="logoutAdmin()" style="display:none; background:#dc3545; margin-bottom:15px;">Cerrar Sesión Admin</button>

        <!-- PANEL DE CONTROL ADMINISTRATIVO -->
        <div class="admin-only" style="background: #fff9e6; padding: 12px; border-radius: 8px; border: 1px dashed #ffc107; margin-bottom: 15px;">
            <h4 style="color: #b98d00; margin-top: 0;">Panel de Control y Mantenimiento</h4>
            
            <!-- Indicador de Almacenamiento Consumido -->
            <div class="storage-meter">
                <span class="storage-text">Calculando almacenamiento...</span>
                <div class="storage-bar-bg"><div class="storage-bar-fill"></div></div>
            </div>

            <!-- Botón de Limpieza Automática de Fotos Viejas -->
            <button onclick="limpiarFotosAntiguas()" style="background:#d9534f; margin-bottom: 15px; font-size: 0.85rem;">
                🧹 Borrar Fotos/Noticias de más de 6 Meses (Liberar Espacio)
            </button>

            <hr style="border: 0; border-top: 1px solid #ffe8a1; margin: 15px 0;">

            <!-- SECCIÓN 1: PUBLICAR NOTICIA -->
            <h4 style="color: #003366; margin-top: 0;"><i class="fa-regular fa-pen-to-square"></i> Publicar Noticia Informativa</h4>
            <input id="titulo" placeholder="Título de la noticia">
            <input id="fecha" type="date">
            <textarea id="descripcion" style="height:90px" placeholder="Escribe el contenido aquí..."></textarea>
            
            <label style="font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px;">Selecciona foto(s) para la noticia:</label>
            <input id="foto" type="file" accept="image/*" multiple>

            <button id="btnPublicar" onclick="publicar()" style="background: #28a745; margin-bottom:15px;">Publicar noticia</button>

            <hr style="border: 0; border-top: 1px solid #ffe8a1; margin: 15px 0;">

            <!-- SECCIÓN 2: SUBIDA MASIVA A GALERÍA DE CUALQUIER ACTIVIDAD -->
            <h4 style="color: #003366; margin-top: 0;"><i class="fa-solid fa-camera"></i> Subida Masiva a Galería de Actividades</h4>
            <label style="font-size: 0.85rem; color: #555; display: block; margin-bottom: 4px;">Nombre de la actividad o evento (opcional):</label>
            <input id="galeriaTitulo" placeholder="Ej. Convivio, Entrega de Uniformes, Capacitación...">
            
            <label style="font-size: 0.85rem; color: #555; display: block; margin-bottom: 4px;">Selecciona múltiples fotos desde tu celular:</label>
            <input id="galeriaInputFoto" type="file" accept="image/*" multiple>
            
            <button onclick="subirFotoGaleria()" style="background: #003366;">🚀 Subir fotos a Galería</button>
        </div>
        
        <div id="lista"></div>

        <h3 style="margin-top:25px; color:#003366;"><i class="fa-solid fa-images"></i> Galería de Fotos de Actividades</h3>
        <div id="galeriaFotosGrid" class="gallery-grid"></div>
    </div>
</div>

<!-- PESTAÑA FINANZAS -->
<div id="docs" class="tab">
    <div class="card-section" id="reportePDF">
        <h2><i class="fa-solid fa-chart-line"></i> Reporte Financiero</h2>
        <select id="mesSelector"></select>
        <button onclick="descargarPDF()" style="margin-top:10px;">Descargar PDF</button>
    </div>
</div>

</body>
</html>
